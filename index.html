<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WITAR 2026 - Treasure Hunt</title>
    <style>
        body {
            background-color: #0b192c;
            color: #f1f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: radial-gradient(circle, #102a43 0%, #0b192c 100%);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }
        .logo {
            max-width: 180px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            margin-bottom: 20px;
        }
        h1 {
            color: #d4af37;
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .subtitle {
            color: #38b6ff;
            font-size: 1.2em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .clue-box {
            background-color: rgba(11, 25, 44, 0.8);
            border-left: 5px solid #38b6ff;
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .congrats {
            font-size: 1.6em;
            color: #00ff66;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .clue-text {
            font-size: 1.3em;
            line-height: 1.6;
            color: #ffffff;
        }
        .riddle {
            font-style: italic;
            color: #ffcc00;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1.4em;
        }
        footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #829ab1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replace 'logo.png' with your uploaded logo filename -->
        <img src="logo.png" alt="WITAR 2026 Logo" class="logo">
        
        <h1>WITAR 2026</h1>
        <div class="subtitle">Bentonville Campus Adventure Race</div>
        
        <div class="clue-box">
            <div class="congrats">Great Job So Far !!</div>
            <div class="clue-text">Just one step away from the treasure!</div>
            <div class="riddle">"Where comfort sits, the secret sleeps beneath" :)</div>
        </div>

        <footer>
            Walmart Item Team Treasure Adventure Race &copy; 2026
        </footer>
    </div>

</body>
</html>
